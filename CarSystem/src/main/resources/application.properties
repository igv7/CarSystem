#**************************************MongoDB*******************************************************
#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017
#spring.data.mongodb.database=MongoDB

#spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<cluster-name><MongoDB URL>/MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/MongoDB

#**************************************PostgresSQL******************************************************
spring.datasource.url=jdbc:postgresql://localhost:5432/PostgresDB
spring.datasource.username= postgres
# spring.datasource.password=*****
spring.datasource.password=admin
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.hibernate.show_sql=true
spring.jpa.database=POSTGRESQL
spring.main.allow-bean-definition-overriding=true

#**************************************Logging**********************************************************
# Written relative to the directory the app is started from; rotates at 10MB, keeps 30 days
logging.file.name=logs/carsystem.log
logging.file.max-size=10MB
logging.file.max-history=30
# Levels: DEBUG = step details and read results, INFO = data changes and logins, ERROR = failures.
# Set to INFO to hide the DEBUG lines.
logging.level.com.Igor.CarSystem=DEBUG

#**************************************Validation*******************************************************
# Request bodies are validated in the controllers (@Valid). Don't re-validate on save, so existing rows
# that predate the rules (e.g. an old phone format) can still be updated by renting and billing.
spring.jpa.properties.javax.persistence.validation.mode=none
